<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lions Playbook</title>
<meta name="description" content="The Lions basketball playbook. Every play, frame by frame.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#e3e8ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1215" media="(prefers-color-scheme: dark)">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/board.css">
<link rel="stylesheet" href="css/team.css">
<script src="js/core.js" defer></script>
<script src="js/draw.js" defer></script>
<script src="js/viewer.js" defer></script>
<script src="vendor/qrcode.js" defer></script>
<script src="js/team.js" defer></script>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="2.4"/>
        <path d="M3 16h26M16 3v26M7 6.5c4 3 6 6 6 9.5s-2 6.5-6 9.5M25 6.5c-4 3-6 6-6 9.5s2 6.5 6 9.5" fill="none" stroke="currentColor" stroke-width="2"/>
      </svg>
      <h1>Lions Playbook</h1>
    </div>
    <button class="btn" id="share-btn" type="button">Share</button>
  </header>

  <div class="layout">
    <aside class="side" id="side" aria-label="Plays">
      <div class="side-head">
        <h2>Plays <span class="count" id="count"></span></h2>
      </div>
      <div class="groups" id="groups"></div>
      <p class="empty" id="list-msg">Loading plays…</p>
    </aside>

    <main class="main" id="main" hidden>
      <button class="btn small back-link" id="back-to-list" type="button">&#9664; All plays</button>
      <section class="meta" aria-label="Play details">
        <h2 class="play-title" id="play-title"></h2>
        <p class="play-sub" id="play-sub"></p>
        <p class="play-note" id="play-note" hidden></p>
      </section>

      <div class="work">
        <div class="board-col">
          <p class="hint" id="hint"></p>
          <div class="board-wrap" id="board-wrap"><svg id="board" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Basketball court with the play drawn on it"></svg></div>
          <div class="steps">
            <span class="steps-label">Frames</span>
            <div class="step-tabs" id="step-tabs"></div>
            <span class="grow"></span>
            <button class="btn small" id="full-view" type="button" aria-pressed="false">Full diagram</button>
            <div class="transport" role="group" aria-label="Frame by frame">
              <button class="btn" id="prev-frame" type="button" title="Back one frame (left arrow key)">&#9664; Back</button>
              <button class="btn" id="next-frame" type="button" title="Play this frame (right arrow key)">Next &#9654;</button>
            </div>
            <button class="btn primary" id="play-btn" type="button">&#9654; Play all</button>
          </div>
        </div>

        <aside class="readout" aria-label="Play readout">
          <h3>Readout</h3>
          <p class="fine">Tap a frame to jump to it.</p>
          <ol id="readout"></ol>
        </aside>
      </div>
    </main>
  </div>

  <dialog class="share" id="share" aria-labelledby="share-title">
    <form method="dialog" class="share-in">
      <div class="share-head">
        <h2 id="share-title">Share the playbook</h2>
        <button class="btn small" value="close">Close</button>
      </div>
      <p class="fine">Teammates can scan the code with their phone camera or open the link.</p>
      <div class="qr" id="qr"></div>
      <div class="link-row">
        <label class="sr" for="share-link">Playbook link</label>
        <input id="share-link" type="text" readonly>
        <button class="btn primary" id="copy-link" type="button">Copy</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</div>
</body>
</html>
